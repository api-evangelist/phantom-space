aid: phantom-space
name: Phantom Space
description: 'Phantom Space Corporation is an American space transportation and satellite
  manufacturing company founded in 2019 and headquartered at 1816 S Research Loop in
  Tucson, Arizona. Co-founded by Jim Cantrell, Michael D''Angelo and Michal Prywata,
  it is developing the Daytona family of small-lift orbital launch vehicles — Daytona
  I, II and III — alongside modular satellite buses, spacecraft manufacturing and
  constellation deployment services, pursuing a mass-manufacturing, fully US-based
  supply chain approach to launch and spacecraft production. The company acquired
  StratSpace and Micro Aerospace Solutions in 2021 to build out its satellite supply
  chain. Phantom Space sells launch capacity and satellite build programs through
  direct commercial contracts; it publishes no public developer program, API, SDK or
  machine-readable specification of any kind.'
